:root{
  --green:#2E7D32;
  --green-dark:#1B5E20;
  --surface:#f3f7f2;
  --card:#fff;
  --ink:#17251a;
  --muted:#617064;
  --line:#d7e4d8;
  --amber:#fff5d6;
  --red:#ffe9e7
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  padding-bottom:24px
}

.topbar{
  background:var(--green);
  color:#fff;
  padding:18px max(18px,calc((100vw - 1180px)/2));
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  box-shadow:0 4px 18px rgba(27,94,32,.25)
}

.brand{
  font-size:28px;
  font-weight:900;
  letter-spacing:-.04em
}

.store-icon{
  font-size:32px
}

.topbar p{
  margin:4px 0 0;
  opacity:.88;
  font-size:14px
}

.session-pill{
  background:#fff;
  color:#1B5E20;
  border-radius:999px;
  padding:9px 13px;
  font-weight:800;
  font-size:13px;
  white-space:nowrap
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4CAF50;
  margin-right:7px
}

.notice{
  max-width:1180px;
  margin:14px auto 0;
  padding:12px 16px;
  background:#fff8d7;
  border:1px solid #ead98d;
  border-radius:12px;
  font-size:13px;
  line-height:1.5
}

.notice span{
  display:block;
  color:#685d23
}

.tabs{
  max-width:1180px;
  margin:14px auto 0;
  padding:0 18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.tab{
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:15px 8px;
  font-weight:800
}

.tab.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green)
}

main{
  max-width:1180px;
  margin:16px auto 0;
  padding:0 18px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.stat{
  background:#fff;
  border-radius:14px;
  padding:16px;
  min-height:112px;
  display:flex;
  flex-direction:column;
  box-shadow:0 2px 8px rgba(0,0,0,.04)
}

.stat span{
  color:var(--muted);
  font-weight:700;
  font-size:13px
}

.stat strong{
  font-size:25px;
  margin:8px 0 4px
}

.stat small{
  color:var(--muted);
  font-size:12px
}

.stat.green{
  background:#e8f5e9
}

.stat.amber{
  background:var(--amber)
}

.stat.red{
  background:var(--red)
}

.search{
  margin-top:16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  display:flex;
  align-items:center;
  padding:0 14px
}

.search input{
  border:0;
  outline:0;
  width:100%;
  padding:15px 10px
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin:22px 0 12px
}

.section-title h2{
  margin:0
}

.section-title span{
  color:var(--muted);
  font-size:13px
}

.added-banner{
  background:#1B5E20;
  color:#fff;
  border-radius:10px;
  padding:11px 13px;
  margin:-4px 0 12px;
  font-weight:800
}

.benta-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 350px;
  gap:18px;
  align-items:start
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.product-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  text-align:left;
  display:flex;
  flex-direction:column;
  min-height:186px
}

.product-card:hover{
  border-color:var(--green);
  box-shadow:0 4px 12px rgba(46,125,50,.12)
}

.product-emoji{
  font-size:32px
}

.product-card strong{
  margin-top:9px
}

.price{
  color:var(--green);
  font-size:21px;
  font-weight:900;
  margin:3px 0
}

.meta{
  color:var(--muted);
  font-size:12px
}

.low{
  color:#c62828
}

.add{
  margin-top:auto;
  color:var(--green);
  font-weight:800;
  font-size:13px
}

.cart{
  background:#fff;
  border-radius:16px;
  padding:18px;
  position:sticky;
  top:calc(var(--safe-area-inset-top) + 10px);
  box-shadow:0 4px 18px rgba(0,0,0,.08)
}

.cart-head,.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.cart-head h2,.panel h2{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  font-size:18px
}

.cart-item{
  display:grid;
  grid-template-columns:1fr 86px 70px 30px;
  gap:8px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee
}

.cart-item>div:first-child{
  display:flex;
  flex-direction:column
}

.cart-item span{
  font-size:12px;
  color:var(--muted)
}

.qty{
  display:flex;
  align-items:center;
  gap:6px
}

.qty button{
  width:28px;
  height:28px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff
}

.icon-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  width:36px;
  height:36px;
  display:grid;
  place-items:center
}

.icon-btn.danger{
  color:#c62828
}

.totals{
  padding:14px 0
}

.totals>div{
  display:flex;
  justify-content:space-between;
  margin:5px 0
}

.checkout-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.checkout-actions .ghost{
  grid-column:1/-1
}

.primary{
  background:var(--green);
  color:#fff;
  border:0;
  border-radius:10px;
  padding:13px 16px;
  font-weight:800
}

.ghost{
  background:#eef3ee;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  font-weight:700
}

.utang-btn{
  background:#ff8f00;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:13px;
  font-weight:800
}

.hint{
  font-size:12px;
  color:var(--muted);
  line-height:1.5
}

.checkout-box{
  background:#f1f8e9;
  border-radius:12px;
  padding:14px
}

.checkout-box h3{
  margin:0 0 12px
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.row.small button{
  padding:9px 10px;
  font-size:13px
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:18px;
  align-items:start
}

.panel{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.04)
}

.panel+.panel{
  margin-top:0
}

label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin:12px 0 4px
}

label input,label select,label textarea,input,select,textarea{
  width:100%;
  border:1px solid #cbd8cd;
  border-radius:10px;
  padding:12px;
  margin-top:6px;
  background:#fff;
  color:var(--ink)
}

input:focus,select:focus,textarea:focus{
  outline:2px solid #a5d6a7
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.tubo-preview{
  background:#e8f5e9;
  border-radius:10px;
  padding:13px;
  display:flex;
  justify-content:space-between;
  margin:14px 0
}

.list-row,.utang-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #eee
}

.list-row>div:first-child{
  display:flex;
  flex-direction:column
}

.list-row span,.utang-row span{
  font-size:12px;
  color:var(--muted)
}

.badge{
  background:#ffebee;
  color:#c62828;
  border-radius:999px;
  padding:3px 7px;
  font-size:10px;
  margin-left:5px
}

.confirm{
  background:#fff3e0;
  border:1px solid #ffcc80;
  border-radius:10px;
  padding:14px;
  margin-top:14px
}

.confirm p{
  margin:0 0 12px;
  font-weight:700
}

.danger-btn{
  background:#c62828;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:12px 14px;
  font-weight:800
}

.empty{
  color:var(--muted);
  padding:18px 0
}

.utang-layout{
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:18px;
  align-items:start
}

.stack{
  display:grid;
  gap:18px
}

.filters{
  display:flex;
  gap:8px;
  margin:16px 0
}

.filter{
  border:1px solid var(--line);
  background:#f5f5f5;
  border-radius:999px;
  padding:9px 13px
}

.filter.active{
  background:var(--green);
  color:#fff
}

.customer-group{
  border-top:1px solid #eee;
  padding:13px 0
}

.group-head{
  display:flex;
  justify-content:space-between
}

.group-head span{
  color:var(--green);
  font-weight:800
}

.total-utang{
  color:#d32f2f
}

.sms,.paid{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:5px
}

.paid{
  background:#e8f5e9;
  color:#1B5E20
}

.report-layout{
  display:grid;
  gap:18px
}

.stats.wide{
  grid-template-columns:repeat(4,1fr)
}

.chart{
  display:flex;
  align-items:end;
  gap:12px;
  height:210px;
  margin-top:25px
}

.bar-col{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  height:100%
}

.bar-col>span{
  font-size:11px
}

.bar-track{
  height:150px;
  width:42px;
  display:flex;
  align-items:end
}

.bar{
  width:100%;
  background:var(--green);
  border-radius:7px 7px 0 0
}

.top-row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee
}

.backup-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin:16px 0
}

.local-tag{
  background:#e8f5e9;
  color:#1B5E20;
  padding:4px 8px;
  border-radius:999px;
  font-size:11px
}

.install{
  background:#f1f8e9;
  border-radius:10px;
  padding:14px;
  margin-top:18px;
  line-height:1.5
}

.copy-helper{
  position:fixed;
  left:-9999px;
  top:0;
  width:1px;
  height:1px;
  opacity:0
}

footer{
  max-width:1180px;
  margin:24px auto 0;
  padding:0 18px;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px
}

footer span{
  display:flex;
  align-items:center;
  gap:6px
}

@media(max-width:760px){
  .topbar{
    align-items:flex-start
  }

  .topbar p{
    display:none
  }

  .session-pill{
    font-size:11px;
    padding:8px 10px
  }

  .brand{
    font-size:22px
  }

  .tabs{
    grid-template-columns:repeat(2,1fr);
    padding:0 12px
  }

  .tab{
    padding:12px 6px;
    font-size:13px
  }

  main{
    padding:0 12px
  }

  .stats,.stats.wide{
    grid-template-columns:1fr 1fr
  }

  .stat strong{
    font-size:20px
  }

  .benta-layout,.two-col,.utang-layout{
    grid-template-columns:1fr
  }

  .cart{
    position:static
  }

  .product-grid{
    grid-template-columns:1fr 1fr
  }

  .product-card{
    min-height:180px
  }

  .cart-item{
    grid-template-columns:1fr 76px 62px 28px
  }

  .field-row{
    grid-template-columns:1fr
  }

  .list-row,.utang-row{
    align-items:flex-start;
    flex-direction:column
  }

  .row.small{
    width:100%
  }

  .chart{
    gap:5px
  }

  .bar-track{
    width:30px
  }

  .bar-col>span{
    font-size:9px
  }

  footer{
    flex-direction:column;
    gap:8px
  }

  .notice span{
    display:inline
  }

  .backup-actions button{
    flex:1 1 140px
  }
}

@media(max-width:390px){
  .product-grid{
    grid-template-columns:1fr 1fr
  }

  .product-card{
    padding:12px
  }

  .cart-item{
    grid-template-columns:1fr 70px
  }

  .cart-item>strong,.cart-item>.icon-btn{
    display:none
  }

  .tabs{
    grid-template-columns:1fr 1fr
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --surface:#111814;
    --card:#1b261e;
    --ink:#edf5ee;
    --muted:#a9bbb0;
    --line:#35483a;
    --amber:#3a3319;
    --red:#3f211f
  }

  body{
    background:var(--surface);
    color:var(--ink)
  }

  .stat,.search,.product-card,.cart,.panel{
    background:#1e2b22;
    color:var(--ink)
  }

  .search input,input,select,textarea{
    background:#17231b;
    color:var(--ink);
    border-color:#3c4c40
  }

  .primary,.tab.active{
    background:#43a047
  }

  .notice{
    background:#322f17;
    color:#fff8d7;
    border-color:#655f2f
  }

  .notice span{
    color:#e5dba0
  }

  .ghost,.filter,.qty button,.icon-btn,.sms{
    background:#26352a;
    color:var(--ink);
    border-color:#3c4c40
  }

  .cart-item,.list-row,.utang-row,.customer-group,.top-row{
    border-color:#35483a
  }

  .checkout-box,.tubo-preview,.install{
    background:#253c28
  }

  .paid{
    background:#294c2f
  }

  .confirm{
    background:#3d2f1c
  }
}
