  --tw-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 1px 3px 0 var(--tw-shadow-color), 0 1px 2px -1px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-lg {
  --tw-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 10px 15px -3px var(--tw-shadow-color), 0 4px 6px -4px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.blur-md {
  --tw-blur: blur(12px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --primary:#16A34A;
  --primary-dark:#15803D;
  --primary-soft:#DCFCE7;
  --primary-soft-2:#F0FDF4;
  --surface:#FFFFFF;
  --bg:#F6F8F5;
  --ink:#17211A;
  --muted:#66746B;
  --line:#E2E8E3;
  --amber:#F59E0B;
  --amber-soft:#FEF3C7;
  --red:#DC2626;
  --red-soft:#FEE2E2;
  --blue-soft:#DBEAFE;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#1A241E;
    --bg:#101713;
    --ink:#F1F5F0;
    --muted:#A9B8AC;
    --line:#2E3B32;
    --primary-soft:#173F27;
    --primary-soft-2:#142B1C;
    --amber-soft:#3A2B12;
    --red-soft:#3B1D1D;
    --blue-soft:#1C2B3F;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  min-height:48px
}

input,select,textarea{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:12px;
  padding:12px 14px;
  width:100%;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 8px 24px rgba(20,40,25,.06)
}

.chip{
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  border:0;
  border-radius:12px;
  padding:0 16px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer
}

.btn-primary:active{
  transform:translateY(1px)
}

.btn-ghost{
  background:var(--primary-soft-2);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 14px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer
}

.btn-danger{
  background:var(--red-soft);
  color:var(--red);
  border:1px solid #FECACA;
  border-radius:12px;
  padding:0 12px;
  font-weight:800;
  cursor:pointer
}

.tab-btn{
  min-height:56px;
  border:0;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  flex:1
}

.tab-btn.active{
  color:var(--primary)
}

.tab-btn.active .tab-icon{
  background:var(--primary-soft);
  border-radius:999px
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.hover\:border-green-500:hover {
  --tw-border-opacity: 1;
  border-color: rgb(34 197 94 / var(--tw-border-opacity, 1));
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

@media (min-width: 640px) {
  .sm\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .sm\:inline {
    display: inline;
  }

  .sm\:inline-flex {
    display: inline-flex;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:gap-4 {
    gap: 1rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:text-\[36px\] {
    font-size: 36px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
